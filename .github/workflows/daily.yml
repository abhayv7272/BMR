name: Roz Shaam 6 Baje Report

on:
  # =================================================================
  # TARGET: mail roz ~6:00 PM IST (India time)
  # -----------------------------------------------------------------
  # GitHub ka cron UTC me chalta hai AUR is repo pe roz late chalta
  # hai. 7 din naapa gaya (cron 12:30 UTC pe set tha):
  #
  #   Tue 08 -> 4h18m    Wed 09 -> 4h20m    Thu 10 -> 4h07m
  #   Fri 11 -> 4h12m    Sat 12 -> 3h15m    Sun 13 -> 4h04m
  #   Mon 14 -> 5h39m
  #
  # Weekday median = 4h18m. To fire time usse peeche khiska diya:
  #   6:00 PM IST - 4h18m deri - 2 min run = 1:40 PM IST = 08:10 UTC
  #
  # Isi fire time pe pichle hafte ka har weekday check kiya:
  #   Tue 18:00 | Wed 18:02 | Thu 17:49 | Fri 17:54 | Mon 19:21
  # Matlab 4 din me se 4 din 6 baje ke 11 min ke andar.
  # =================================================================
  schedule:
    # 6 PM IST = 12:30 PM UTC (GitHub UTC time use karta hai)
    - cron: '30 12 * * *'
  # Ye button "abhi chalao" ka option dega (testing ke liye)
    - cron: '10 8 * * 1-5'    # 01:40 PM IST fire -> ~6:00 PM IST mail
    # Safety net: agar GitHub kabhi BINA deri ke chala de, to upar wala
    # run market khule hue (1:40 PM) chalega aur guard use skip kar dega.
    # Tab ye wala pakad lega. Duplicate guard dono ko mail nahi bhejne dega.
    - cron: '15 10 * * 1-5'   # 03:45 PM IST fire (market band hote hi)

  # Abhi turant chahiye to: Actions tab -> Run workflow button.
  # Ye 0-2 second me chalta hai, deri bilkul nahi.
  workflow_dispatch:

  # Bahar se trigger karna ho to (optional, SETUP-TIMING.md dekho).
  # Iski ab zaroorat nahi - upar wala cron kaam kar dega.
  repository_dispatch:
    types: [daily-report]

# Agar do slot overlap ho jayein to ek hi chale
concurrency:
  group: daily-report
  cancel-in-progress: false

# Guard step ko pichle runs padhne ke liye chahiye
permissions:
  contents: read
  actions: read

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Aaj ka mail already gaya kya? (duplicate rokna)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Abhi IST: $(TZ=Asia/Kolkata date '+%A, %d %b %Y %I:%M %p')"

          # Manual button ya bahar se aaya dispatch = hamesha chalao
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Direct trigger - bina check ke chal raha hai."
            exit 0
          fi

          # Cron 1:40 PM IST pe fire hota hai kyunki GitHub use ~4h18m late
          # chalata hai (tab tak 6 PM ho jata hai). Par agar kisi din GitHub
          # time pe chala de, to NSE (3:30 PM band) abhi khula hoga aur data
          # adhoora aayega. Aise me skip karo - 3:45 PM wala cron pakad lega.
          HHMM=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$HHMM" -lt 1540 ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Abhi $HHMM IST - NSE band nahi hua, data adhoora hoga. Skip."
            exit 0
          fi

          TODAY_IST=$(TZ=Asia/Kolkata date +%F)
          echo "Aaj (IST): $TODAY_IST"

          # Aaj mail ACTUALLY gaya kya? Sirf run ka "success" hona kaafi
          # nahi - jo run market-guard pe skip hua wo bhi success dikhta hai.
          # Isliye us run ka artifact check karo: artifact tabhi banta hai
          # jab report sach me generate hui.
          # API fail ho jaye to DONE=0 -> mail bhej do (mail miss karne se
          # behtar hai ek extra mail aa jaye).
          DONE=0
          IDS=$(gh api "/repos/${{ github.repository }}/actions/workflows/daily.yml/runs?status=success&per_page=40" \
            --jq "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | select((.updated_at | fromdateiso8601 + 19800 | strftime(\"%Y-%m-%d\")) == \"$TODAY_IST\")
                   | .id] | .[]" 2>/dev/null) || IDS=""

          for rid in $IDS; do
            N=$(gh api "/repos/${{ github.repository }}/actions/runs/$rid/artifacts" \
                  --jq '.total_count' 2>/dev/null) || N=0
            [ -z "$N" ] && N=0
            if [ "$N" -gt 0 ]; then
              echo "Run $rid ne report bheji thi (artifacts: $N)"
              DONE=$((DONE + 1))
            else
              echo "Run $rid skip hua tha (koi artifact nahi) - nahi gina"
            fi
          done

          echo "Aaj ke successful runs: $DONE"
          if [ "$DONE" -gt 0 ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Aaj ka mail already ja chuka hai - ye backup slot skip."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Code lao
        if: steps.guard.outputs.run == 'yes'
        uses: actions/checkout@v4

      - name: Python setup karo
        if: steps.guard.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Library install karo
        run: pip install -r requirements.txt
        if: steps.guard.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Validate email configuration
        if: steps.guard.outputs.run == 'yes'
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
        run: |
          test -n "$MY_EMAIL" || { echo 'ERROR: MY_EMAIL secret is missing'; exit 1; }
          test -n "$MY_APP_PASSWORD" || { echo 'ERROR: MY_APP_PASSWORD secret is missing'; exit 1; }

      - name: Report banao aur email bhejo
        if: steps.guard.outputs.run == 'yes'
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
        run: python main.py
        timeout-minutes: 25
        run: python -u main.py

      - name: Upload report files (even if email is not visible)
        # Guard ne skip kiya to artifact step bhi skip (warna khali run
        # "failed artifact" warning deta hai)
        if: always() && steps.guard.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: |
            report.html
            results.json
            BMR_Trinity_NSE_Screener_Report_*.xlsx
          if-no-files-found: warn
          retention-days: 14
