name: Roz Shaam 6 Baje Report

on:
  # =================================================================
  # TARGET: mail roz ~6:00 PM IST (India time)
  # -----------------------------------------------------------------
  # India time = UTC/GMT +05:30, aur DST nahi hota.
  # GitHub scheduled cron UTC me chalta hai aur is repo me pichhle runs
  # consistently 3-6 ghante late execute hue hain. Purana exact 12:30 UTC
  # (6:00 PM IST) slot isi wajah se raat 10-11:40 PM IST tak mail bhej raha tha.
  #
  # Isliye old 12:30 UTC slot hata diya gaya hai.
  # Primary slot 08:10 UTC / 01:40 PM IST hai, jo observed GitHub delay ke
  # baad approx 6 PM IST tak pahunchta hai. 10:15 UTC / 03:45 PM IST backup
  # hai, taaki agar primary market close se pehle chal jaye/skip ho jaye to
  # report miss na ho.
  #
  # Sabse accurate 5:55-6:00 PM IST delivery ke liye repository_dispatch ko
  # cron-job.org se trigger karo (SETUP-TIMING.md me steps hain).
  # =================================================================
  schedule:
    - cron: '10 8 * * 1-5'    # 01:40 PM IST fire -> observed delay ke baad ~6 PM IST
    - cron: '15 10 * * 1-5'   # 03:45 PM IST safety net (NSE close ke baad)

  # Abhi turant chahiye to: Actions tab -> Run workflow button.
  workflow_dispatch:

  # Bahar se exact 5:55 PM IST pe trigger karna ho to SETUP-TIMING.md dekho.
  repository_dispatch:
    types: [daily-report]

# Agar do slot overlap ho jayein to ek hi chale
concurrency:
  group: daily-report
  cancel-in-progress: false

# Guard step ko pichle runs padhne ke liye chahiye
permissions:
  contents: read
  actions: read

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      # Scan universe size. 1500 = embedded top-1000 + best 500 extras
      # (extras NSE ke live list se aate hain, turnover se ranked).
      # Rollback chahiye to yahan 1000 kar dein - baaki kuch nahi badlega.
      BMR_UNIVERSE_SIZE: "1500"
      # Yahoo 429 hardening (defaults main.py me hain, yahan sirf override ke liye):
      #   BMR_YF_MAX_ATTEMPTS: "4"     # per download attempt
      #   BMR_YF_BACKOFF_BASE: "5"     # 5s, 10s, 20s ... (cap BMR_YF_BACKOFF_CAP=60)
      #   BMR_YF_CHUNK_DELAY: "1.5"    # do downloads ke beech gap (seconds)

    steps:
      - name: Aaj ka mail already gaya kya? (duplicate rokna)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Schedule cron: ${{ github.event.schedule }}"
          echo "Abhi IST: $(TZ=Asia/Kolkata date '+%A, %d %b %Y %I:%M %p')"

          # Manual button ya bahar se aaya dispatch = hamesha chalao
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Direct trigger - bina schedule guard ke chal raha hai."
            exit 0
          fi

          # Agar GitHub primary slot ko bina delay ke chala de, to NSE
          # (3:30 PM IST close) se pehle data adhoora ho sakta hai.
          # Aise runs skip honge; 3:45 PM backup ya external dispatch pakad lega.
          HHMM=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$HHMM" -lt 1540 ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Abhi $HHMM IST - NSE band nahi hua, data adhoora hoga. Skip."
            exit 0
          fi

          TODAY_IST=$(TZ=Asia/Kolkata date +%F)
          echo "Aaj (IST): $TODAY_IST"

          # Aaj market close ke baad report ACTUALLY bani kya?
          # Sirf run success hona kaafi nahi: guard-skip run bhi success hota hai.
          # Artifact tabhi banta hai jab report generate hui. Early morning/manual
          # test artifacts ko ignore karo, warna evening mail galti se skip ho jayega.
          DONE=0
          IDS=$(gh api "/repos/${{ github.repository }}/actions/workflows/daily.yml/runs?status=success&per_page=40" \
            --jq "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | (.updated_at | fromdateiso8601 + 19800) as \$ts
                   | select((\$ts | strftime(\"%Y-%m-%d\")) == \"$TODAY_IST\")
                   | select((\$ts | strftime(\"%H%M\") | tonumber) >= 1540)
                   | .id] | .[]" 2>/dev/null) || IDS=""

          for rid in $IDS; do
            N=$(gh api "/repos/${{ github.repository }}/actions/runs/$rid/artifacts" \
                  --jq '.total_count' 2>/dev/null) || N=0
            [ -z "$N" ] && N=0
            if [ "$N" -gt 0 ]; then
              echo "Run $rid ne market close ke baad report bheji thi (artifacts: $N)"
              DONE=$((DONE + 1))
            else
              echo "Run $rid skip hua tha (koi artifact nahi) - nahi gina"
            fi
          done

          echo "Aaj ke post-market report runs: $DONE"
          if [ "$DONE" -gt 0 ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Aaj ka post-market mail already ja chuka hai - ye backup slot skip."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Code lao
        if: steps.guard.outputs.run == 'yes'
        uses: actions/checkout@v4

      - name: Python setup karo
        if: steps.guard.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Library install karo
        if: steps.guard.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Validate email configuration
        if: steps.guard.outputs.run == 'yes'
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
        run: |
          test -n "$MY_EMAIL" || { echo 'ERROR: MY_EMAIL secret is missing'; exit 1; }
          test -n "$MY_APP_PASSWORD" || { echo 'ERROR: MY_APP_PASSWORD secret is missing'; exit 1; }

      - name: Report banao aur email bhejo
        if: steps.guard.outputs.run == 'yes'
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
        timeout-minutes: 30
        run: python -u main.py

      - name: Upload report files (even if email is not visible)
        # Guard ne skip kiya to artifact step bhi skip (warna khali run
        # "failed artifact" warning deta hai)
        if: always() && steps.guard.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: |
            report.html
            results.json
            BMR_Trinity_NSE_Screener_Report_*.xlsx
          if-no-files-found: warn
          retention-days: 14
